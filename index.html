<script>
const D=[{"t": "Lecture 1: Ideological Basis of Pakistan & Evolution of Two-Nation Theory", "q": [{"q": "What is defined in the source context as a set of principles, values, and guidance system that gives order and meaning to human life?", "o": ["Legal Code", "Ideology", "Constitution", "Manifesto"], "a": 1, "e": "Ideology is a set of beliefs, values, and ideals ingrained in social consciousness that provides a framework for action and a worldview for a nation."}, {"q": "The legal sanction and formal approval of the Ideology of Pakistan was granted by the Constituent Assembly through which historic document in March 1949?", "o": ["Objectives Resolution", "Independence Act", "Basic Principles Committee Report", "Lahore Resolution"], "a": 0, "e": "The Objectives Resolution passed in March 1949 gave legal sanction to the Ideology of Pakistan, declaring that sovereignty belongs to Allah Almighty alone."}, {"q": "Who was the Arab general who conquered Sindh in 712 CE, establishing the first permanent foothold of Muslim governance in South Asia?", "o": ["Muhammad Ghauri", "Mahmud of Ghazna", "Qutub-ud-Din Aibak", "Muhammad bin Qasim"], "a": 3, "e": "Muhammad bin Qasim led the Umayyad campaign in 712 CE against Raja Dahir, initiating permanent Muslim residency and Islamic administrative structures in Sindh."}, {"q": "Which prominent Sufi saint, author of *Kashf-ul-Mahjoob*, settled in Lahore and played a pivotal role in mass conversions to Islam?", "o": ["Khawaja Moinuddin Chishti", "Shah Waliullah", "Sheikh Ahmad Sirhindi", "Ali Hajveri (Data Ganj Bakhsh)"], "a": 3, "e": "Sufi saints like Ali Hajveri (Data Ganj Bakhsh) presented the practical, equitable teachings of Islam, inspiring widespread conversions across the Sub-Continent."}, {"q": "Which 17th-century Islamic scholar forcefully resisted the syncretic religion *Deen-e-Ilahi* promulgated by Mughal Emperor Akbar?", "o": ["Sir Syed Ahmad Khan", "Shah Waliullah", "Sheikh Ahmad Sirhindi (Mujaddid Alf Sani)", "Syed Amir Ali"], "a": 2, "e": "Sheikh Ahmad Sirhindi (Mujaddid Alf Sani) challenged Akbar's un-Islamic innovations (*Deen-e-Ilahi*) and advocated the doctrine of *Wahdat-ul-Shuhud* and Muslim distinctiveness."}, {"q": "In which year was the Indian National Congress (INC) established, prompting Sir Syed Ahmad Khan to advise Muslims against joining it?", "o": ["1885", "1906", "1857", "1867"], "a": 0, "e": "The INC was founded in 1885. Sir Syed Ahmad Khan advised Muslims to refrain from joining it to avoid political conflict and focus on modern Western education."}, {"q": "The All-India Muslim League was officially founded in December 1906 at which historical location?", "o": ["Dhaka", "Karachi", "Aligarh", "Simla"], "a": 0, "e": "The All-India Muslim League was established in Dhaka in December 1906 to safeguard Muslim political rights and present their demands to the British Raj."}, {"q": "Under the Lucknow Pact of 1916, what fraction of representation did the Indian National Congress agree to grant Muslims in the Central Legislative Council?", "o": ["Two-fifths (2/5)", "One-fourth (1/4)", "One-half (1/2)", "One-third (1/3)"], "a": 3, "e": "The Lucknow Pact of 1916 marked a historic compromise where Congress recognized separate electorates and agreed to one-third (1/3) Muslim representation in the central legislature."}, {"q": "In which year was the institution of the Ottoman Caliphate officially abolished by the Grand National Assembly of Turkey under Mustafa Kemal Atatürk?", "o": ["1922", "1924", "1920", "1926"], "a": 1, "e": "The Grand National Assembly of Turkey formally abolished the Caliphate in March 1924, bringing an end to the Khilafat Movement in India."}, {"q": "In his landmark Presidential Address to the All-India Muslim League at Allahabad in December 1930, what final destiny did Allama Iqbal propose for Muslims of NW India?", "o": ["Amalgamation of Punjab, NWFP, Sindh, and Balochistan into a consolidated state", "Unitary state with provincial autonomy", "Immediate creation of two sovereign dominions", "Cabinet Mission Plan"], "a": 0, "e": "Allama Iqbal demanded the consolidation of Punjab, NWFP, Sindh, and Balochistan into a self-governing state within or without the British Empire in 1930."}]}, {"t": "Lecture 2: Philosophical Roots & Initial Problems of the New State (1947)", "q": [{"q": "Which 18th-century French philosopher originally coined the term \"ideology\" and defined it strictly as the \"science of ideas\"?", "o": ["Auguste Comte", "Jean-Jacques Rousseau", "Destutt de Tracy", "Montesquieu"], "a": 2, "e": "Destutt de Tracy defined ideology as the \"science of ideas\" to study how human thoughts originate and develop."}, {"q": "Which 18th-century Muslim scholar wrote a decisive letter to Afghan ruler Ahmed Shah Abdali, resulting in the defeat of Marathas at Panipat in 1761?", "o": ["Nawab Abdul Latif", "Shah Waliullah", "Sheikh Ahmad Sirhindi", "Sir Syed Ahmad Khan"], "a": 1, "e": "Shah Waliullah invited Ahmed Shah Abdali to crush the expanding Maratha confederacy at the Third Battle of Panipat (1761)."}, {"q": "What was the initial financial share released to Pakistan by the Indian government post-partition out of the agreed cash reserves?", "o": ["Rs. 750 million", "Rs. 500 million", "Rs. 100 million", "Rs. 200 million"], "a": 3, "e": "India initially released only Rs. 200 million, withholding the remaining Rs. 550 million until Mahatma Gandhi threatened a fast unto death in early 1948."}, {"q": "How many princely states existed across British India on the eve of Partition in August 1947?", "o": ["350", "750", "100", "Over 560"], "a": 3, "e": "There were over 560 princely states in India that had to choose accession to either Pakistan or India based on geography and demography."}, {"q": "The ruler of Junagadh state formally signed accession to Pakistan in 1947. What was the demographic composition of Junagadh's population?", "o": ["Hindu Majority", "Buddhist Majority", "Sikh Majority", "Muslim Majority"], "a": 0, "e": "Junagadh had a Muslim ruler (Nawab Mahabat Khan) who acceded to Pakistan, but its 7 lakh population was overwhelmingly Hindu. Indian troops forcibly occupied it in Nov 1947."}, {"q": "Which major princely state's Muslim ruler (Nizam) desired to remain independent, but was annexed by Indian troops in September 1948?", "o": ["Swat", "Kalat", "Hyderabad Deccan", "Jammu & Kashmir"], "a": 2, "e": "The Nizam of Hyderabad signed a Standstill Agreement, but Indian military forces launched \"Operation Polo\" in September 1948 to forcibly integrate the state."}, {"q": "On which exact date did Indian troops land in Srinagar, starting the military conflict over Jammu and Kashmir?", "o": ["14 August 1947", "31 December 1947", "15 September 1947", "27 October 1947"], "a": 3, "e": "Following the Maharaja's controversial instrument of accession under tribal pressure, Indian troops landed in Srinagar on 27 October 1947."}, {"q": "In September 1960, which international financial institution successfully mediated the Indus Waters Treaty between Pakistan and India?", "o": ["United Nations Development Programme (UNDP)", "International Monetary Fund (IMF)", "World Bank", "Asian Development Bank (ADB)"], "a": 2, "e": "The World Bank mediated the Indus Waters Treaty in September 1960, allocating the Western rivers (Indus, Jhelum, Chenab) to Pakistan."}, {"q": "Which legislative act was adopted with modifications as the first Interim Constitution of Pakistan in August 1947?", "o": ["Objectives Resolution 1949", "Indian Councils Act 1909", "Indian Independence Act 1947", "Government of India Act 1935"], "a": 3, "e": "The Government of India Act 1935, adapted under the Indian Independence Act 1947, served as Pakistan's interim constitutional framework."}, {"q": "What major economic crisis hit Pakistan's agricultural sector in April 1948 due to unilateral Indian action?", "o": ["Wheat rust epidemic", "Cutoff of canal headworks water from West Punjab (Firozpur & Madhopur)", "Jute export embargo", "Locust infestation"], "a": 1, "e": "On April 1, 1948, India shut off water flow from the Firozpur and Madhopur headworks, threatening Pakistan's agricultural canal network."}]}, {"t": "Lecture 3: Era of Political Instability & Early Constitutional Battles (1947–1958)", "q": [{"q": "Who served as the second Governor-General of Pakistan following the death of Quaid-i-Azam M.A. Jinnah in September 1948?", "o": ["Ghulam Muhammad", "Iskander Mirza", "Khawaja Nazimuddin", "Liaquat Ali Khan"], "a": 2, "e": "Khawaja Nazimuddin stepped down as Chief Minister of East Bengal to become Pakistan's 2nd Governor-General (1948–1951)."}, {"q": "The Public and Representative Office Disqualification Act (PRODA), passed in January 1949, allowed disqualification of corrupt politicians for up to how many years?", "o": ["5 years", "3 years", "Lifetime", "10 years"], "a": 3, "e": "PRODA enacted in 1949 targeted political corruption and misconduct, disqualifying convicted public office holders for up to 10 years."}, {"q": "In October 1951, Prime Minister Liaquat Ali Khan was assassinated while addressing a public gathering at Company Bagh in Rawalpindi by which assailant?", "o": ["Mohammad Usman", "Said Akbar", "Dimtri Tsafendas", "Nathuram Godse"], "a": 1, "e": "Liaquat Ali Khan was martyred on 16 October 1951 by an Afghan national named Said Akbar."}, {"q": "In October 1954, Governor-General Ghulam Muhammad controversially dissolved the 1st Constituent Assembly of Pakistan. Who was the Speaker (President) of the Assembly who challenged this dissolution in court?", "o": ["Abdul Wahab Khan", "Fazal Ilahi Chaudhry", "Sardar Bahadur Khan", "Maulvi Tamizuddin Khan"], "a": 3, "e": "Maulvi Tamizuddin Khan challenged the assembly's dissolution in the Sindh Chief Court, winning an initial verdict against the Governor-General."}, {"q": "Which Chief Justice of the Federal Court of Pakistan reversed the Sindh Chief Court ruling in 1955 by invoking the controversial \"Doctrine of Necessity\"?", "o": ["Justice Hamood-ur-Rehman", "Justice S.A. Rahman", "Justice Muhammad Munir", "Justice Alvin Robert Cornelius"], "a": 2, "e": "Chief Justice Muhammad Munir validated Ghulam Muhammad's dissolution of the Constituent Assembly, establishing the legal precedent of the \"Doctrine of Necessity\"."}, {"q": "The \"One Unit\" scheme, which amalgamated all western provinces into a single province of West Pakistan, was promulgated in which year?", "o": ["1958", "1953", "October 1955", "1949"], "a": 2, "e": "Passed under Prime Minister Chaudhry Muhammad Ali in October 1955, the One Unit scheme merged West Pakistan's provinces to achieve parity with East Pakistan."}, {"q": "Who was the first President of Pakistan following the enforcement of the country's first Constitution on 23 March 1956?", "o": ["Ghulam Muhammad", "Major General Iskander Mirza", "Khawaja Nazimuddin", "General Ayub Khan"], "a": 1, "e": "Iskander Mirza, who served as Governor-General since 1955, became the first constitutional President of Pakistan under the 1956 Constitution."}, {"q": "On October 7, 1958, President Iskander Mirza abrogated the 1956 Constitution and appointed which military leader as Chief Martial Law Administrator (CMLA)?", "o": ["General Yahya Khan", "General Ayub Khan", "General Musa Khan", "General Tikka Khan"], "a": 1, "e": "Iskander Mirza declared Martial Law on 7 October 1958, appointing Army C-in-C General Ayub Khan as CMLA. Three weeks later, Ayub deposed Mirza."}, {"q": "A famous study during Ayub Khan's regime revealed extreme wealth concentration in Pakistan. How many families controlled 66% of the nation's industrial assets?", "o": ["50 Families", "22 Families", "100 Families", "10 Families"], "a": 1, "e": "Chief Economist Mahbub-ul-Haq revealed in 1968 that just 22 families controlled 66% of industrial wealth and 80% of banking assets."}, {"q": "The Indo-Pakistan War of 1965 formally ended following a cease-fire and the signing of which diplomatic agreement in January 1966?", "o": ["Tashkent Declaration", "Simla Agreement", "Liaquat-Nehru Pact", "Delhi Accord"], "a": 0, "e": "President Ayub Khan and Indian PM Lal Bahadur Shastri signed the UN-sponsored Tashkent Declaration in January 1966 in the USSR."}]}, {"t": "Lecture 4: The 1971 Crisis & The Bhutto Era (1969–1977)", "q": [{"q": "In January 1968, the Ayub Khan regime filed the Agartala Conspiracy Case, accusing 35 individuals including Sheikh Mujibur Rahman of what offense?", "o": ["Bank fraud", "Conspiring with India to secede East Pakistan via armed revolt", "Rigging elections", "Tax evasion"], "a": 1, "e": "The Agartala Conspiracy Case charged Sheikh Mujib and 34 Bengali civil/military officers with meeting Indian agents in Agartala to plan an armed secession."}, {"q": "In 1966, Sheikh Mujibur Rahman formally presented his famous Six-Point Formula. Where was this formula first announced?", "o": ["Dhaka", "Chittagong", "Lahore", "Calcutta"], "a": 2, "e": "Sheikh Mujib presented his Six-Point Formula at an opposition conference in Lahore in February 1966 as a charter for provincial autonomy."}, {"q": "Under Sheikh Mujib's Six-Point Formula, which two subjects were to be retained exclusively by the Federal (Central) Government?", "o": ["Railways and Communications", "Defense and Foreign Affairs", "Taxation and Foreign Trade", "Finance and Currency"], "a": 1, "e": "Point 2 of the Six-Point Formula restricted federal authority strictly to Defense and Foreign Affairs, vesting all residuary powers in the provinces."}, {"q": "On what date did the Fall of Dhaka occur, culminating in the surrender of Pakistani armed forces and the creation of Bangladesh?", "o": ["14 August 1971", "23 March 1972", "25 March 1971", "16 December 1971"], "a": 3, "e": "On 16 December 1971, Pakistani forces in East Pakistan signed the Instrument of Surrender at Ramna Race Course in Dhaka."}, {"q": "Who signed the Instrument of Surrender in Dhaka on behalf of the Pakistan Eastern Command?", "o": ["Lt. Gen. A.A.K. Niazi", "Lt. Gen. Tikka Khan", "Lt. Gen. Gul Hassan", "Major General Rao Farman Ali"], "a": 0, "e": "Lt. Gen. A.A.K. Niazi surrendered to Lt. Gen. Jagjit Singh Aurora of the joint Indian and Mukti Bahini command."}, {"q": "Under the Simla Agreement signed on 2 July 1972 by Z.A. Bhutto and Indira Gandhi, what was the ceasefire line in Kashmir re-designated as?", "o": ["Line of Control (LoC)", "Working Boundary", "Durand Line", "Radical line"], "a": 0, "e": "The 1971 ceasefire line in Jammu & Kashmir was re-designated as the Line of Control (LoC), which both nations pledged to respect bilaterally."}, {"q": "Under Bhutto's Economic Reform Order of 1972, how many major industrial units across 10 categories were nationalized by the state?", "o": ["10 units", "100 units", "31 major units", "500 units"], "a": 2, "e": "Bhutto nationalized 31 basic industrial units (iron/steel, heavy engineering, cement, chemicals, oil refineries) to break the \"22 Families\" monopoly."}, {"q": "Which article of the 1973 Constitution explicitly defines High Treason for any person who abrogates or subverts the Constitution by force?", "o": ["Article 58", "Article 6", "Article 250", "Article 1"], "a": 1, "e": "Article 6 was inserted into the 1973 Constitution to prevent future military coups by classifying constitutional subversion as high treason."}, {"q": "What was the code-name of the military coup launched by General Zia-ul-Haq on July 5, 1977 that ousted Z.A. Bhutto?", "o": ["Operation Fair Play", "Operation Searchlight", "Operation Gibraltar", "Operation Clean-up"], "a": 0, "e": "General Zia-ul-Haq overthrew Bhutto's elected government on July 5, 1977 under the code-name Operation Fair Play."}, {"q": "On what date was Zulfikar Ali Bhutto executed at Central Jail Rawalpindi following a controversial Supreme Court verdict?", "o": ["5 July 1977", "17 August 1988", "10 April 1986", "4 April 1979"], "a": 3, "e": "Z.A. Bhutto was executed on April 4, 1979 after a split 4–3 Supreme Court ruling in the Kasuri murder case."}]}, {"t": "Lecture 5: Modern Reforms & Political History (1977–Present)", "q": [{"q": "Under General Zia-ul-Haq's Islamisation policy, the Zakat and Ushr Ordinance was promulgated in which year?", "o": ["1977", "1985", "June 1980", "1988"], "a": 2, "e": "Promulgated on June 20, 1980, the ordinance instituted compulsory 2.5% Zakat deduction on bank savings and 10% Ushr on agricultural produce."}, {"q": "In December 1984, General Zia-ul-Haq conducted a national referendum. What was the central question linked to his election as President?", "o": ["Construction of Kalabagh Dam", "Approval of the 1973 Constitution", "Approval of military rule", "Continuation of the process of Islamisation"], "a": 3, "e": "The referendum question framed Zia's 5-year presidential term as an endorsement of his Islamisation process, claiming a 95% \"Yes\" vote."}, {"q": "Who was appointed Prime Minister of Pakistan following the non-party general elections held in February 1985?", "o": ["Zafarullah Khan Jamali", "Nawaz Sharif", "Ghulam Mustafa Jatoi", "Muhammad Khan Junejo"], "a": 3, "e": "Muhammad Khan Junejo of Sindh was handpicked by Zia as civilian Prime Minister following the February 1985 non-party elections."}, {"q": "Which controversial constitutional amendment passed in 1985 empowered the President to unilaterally dissolve the National Assembly under Article 58(2)(b)?", "o": ["13th Amendment", "18th Amendment", "5th Amendment", "8th Amendment"], "a": 3, "e": "The 8th Amendment inserted Article 58(2)(b), giving the President discretionary power to dissolve Parliament, which dominated 1990s politics."}, {"q": "On August 17, 1988, General Zia-ul-Haq died in a fatal C-130 plane crash near which city?", "o": ["Rawalpindi", "Multan", "Quetta", "Bahawalpur"], "a": 3, "e": "Zia-ul-Haq, US Ambassador Arnold Raphel, and top military commanders died in a C-130 crash shortly after takeoff from Bahawalpur."}, {"q": "Who became the first female Prime Minister of a Muslim-majority nation following the November 1988 general elections?", "o": ["Begum Ra'ana Liaquat Ali", "Benazir Bhutto", "Nusrat Bhutto", "Fatima Jinnah"], "a": 1, "e": "Benazir Bhutto took oath as Prime Minister in December 1988, becoming the first female head of government in the Muslim world."}, {"q": "On October 12, 1999, General Pervez Musharraf seized power after Prime Minister Nawaz Sharif attempted to replace him as Army Chief while he was returning from which country?", "o": ["China", "Sri Lanka", "Saudi Arabia", "USA"], "a": 1, "e": "Nawaz Sharif attempted to dismiss Musharraf while his commercial flight was returning from Sri Lanka, triggering the October 12, 1999 coup."}, {"q": "Which institutional body was established by General Musharraf to design the Local Government System (Devolution of Power Plan 2001)?", "o": ["National Economic Council (NEC)", "Planning Commission", "Council of Common Interests (CCI)", "National Reconstruction Bureau (NRB)"], "a": 3, "e": "The NRB headed by Lt. Gen. Tanvir Naqvi developed the 3-tier local government structure (District, Tehsil, Union Council)."}, {"q": "The flagship China-Pakistan Economic Corridor (CPEC) project was officially launched in 2015 under which Prime Minister's tenure?", "o": ["Yousaf Raza Gillani", "Nawaz Sharif", "Imran Khan", "Shahid Khaqan Abbasi"], "a": 1, "e": "CPEC was launched in April 2015 during Nawaz Sharif's third term as a cornerstone of China's Belt and Road Initiative (BRI)."}, {"q": "On April 10, 2022, Imran Khan became the first Prime Minister in Pakistan's history to be ousted by a vote of no-confidence. How many votes were cast against him?", "o": ["150", "174", "160", "180"], "a": 1, "e": "The opposition coalition secured 174 votes in the 342-seat National Assembly, successfully passing the no-confidence motion."}]}, {"t": "Lecture 6: Demography of Pakistan & Population Dynamics", "q": [{"q": "According to Pakistan's 7th Population Census conducted in 2023, what was the total official national population recorded?", "o": ["259.0 million", "241.5 million", "220.5 million", "207.7 million"], "a": 1, "e": "The 2023 digital census recorded Pakistan's population at 241.5 million, reflecting a 33.82 million increase since 2017."}, {"q": "What was the average annual national population growth rate recorded in the 2023 Census?", "o": ["2.1%", "2.55%", "3.2%", "1.6%"], "a": 1, "e": "Pakistan's national population growth rate stood at 2.55% per annum between 2017 and 2023."}, {"q": "Which province recorded the highest annual population growth rate (3.20%) in the 2023 Census results?", "o": ["Khyber Pakhtunkhwa (KPK)", "Punjab", "Balochistan", "Sindh"], "a": 2, "e": "Balochistan logged the highest provincial growth rate at 3.20% per year, followed by ICT (2.80%) and Sindh (2.57%)."}, {"q": "Which province accounted for the largest absolute numerical population increase (17.7 million) between 2017 and 2023?", "o": ["KPK", "Balochistan", "Punjab", "Sindh"], "a": 2, "e": "Punjab's population grew by 17.7 million, reaching 127.69 million out of the country's total 241.5 million."}, {"q": "In Pakistan's very first population census in 1951, what was the total combined population of East and West Pakistan?", "o": ["75.7 million", "93.0 million", "120.0 million", "50.0 million"], "a": 0, "e": "The 1951 Census recorded 75.7 million total citizens (33.7 million in West Pakistan and 42.0 million in East Pakistan)."}, {"q": "Why was the 3rd decennial population census of Pakistan, originally scheduled for 1971, delayed until 1972?", "o": ["Indo-Pakistan War of 1971 and separation of East Pakistan", "Smallpox epidemic", "Financial deficit", "Severe floods"], "a": 0, "e": "The 1971 war and political crisis postponed the census to 1972, which enumerated West Pakistan's population at 65.3 million."}, {"q": "What percentage of Pakistan's current population is estimated to be under 30 years of age, forming the \"Youth Bulge\"?", "o": ["64%", "50%", "78%", "40%"], "a": 0, "e": "Over 64% of Pakistan's population is under 30 years old, representing a major demographic dividend if equipped with skills."}, {"q": "According to demographic profile data, what is the current median age of Pakistan's population?", "o": ["15.5 years", "35.0 years", "28.4 years", "20.8 years"], "a": 3, "e": "Pakistan's median age is approximately 20.8 years, reflecting a young demographic profile."}, {"q": "Under Article 51 of the Constitution of Pakistan, how many seats are specifically reserved for women in the 342-member National Assembly?", "o": ["33 seats", "50 seats", "75 seats", "60 seats"], "a": 3, "e": "Article 51 reserves 60 seats for women (and 10 for non-Muslims) out of 342 total seats in the National Assembly."}, {"q": "Under the Local Government Ordinance of 2000/2001, what minimum percentage of local council seats was legally reserved for women?", "o": ["20%", "33%", "10%", "50%"], "a": 1, "e": "The 2000/2001 local government reforms mandated a 33% quota for women, inducting over 36,000 women into grassroots governance."}]}, {"t": "Lecture 7: History of Media in Pakistan, Press Laws & Digital Censorship", "q": [{"q": "Which prominent English newspaper was founded directly by Quaid-i-Azam Muhammad Ali Jinnah in 1941 to promote the Muslim League's perspective?", "o": ["The Pakistan Times", "The Morning News", "Dawn", "Civil and Military Gazette"], "a": 2, "e": "Quaid-i-Azam founded *Dawn* in Delhi in 1941 as the official mouthpiece for Muslim League nationhood aspirations."}, {"q": "The Pakistan Electronic Media Regulatory Authority (PEMRA) was established by presidential ordinance in 2002 under which regime?", "o": ["Pervez Musharraf", "Zia-ul-Haq", "Nawaz Sharif", "Benazir Bhutto"], "a": 0, "e": "President Pervez Musharraf promulgated the PEMRA Ordinance in 2002, deregulating electronic broadcast channels across Pakistan."}, {"q": "Which legislative ordinance passed in 1979 governs the certification, censoring, and public screening of feature films in Pakistan?", "o": ["Press Council Ordinance", "Censorship Act 1952", "PEMRA Act", "Motion Pictures Ordinance 1979"], "a": 3, "e": "The Motion Pictures Ordinance 1979 established the Central Board of Film Censors (CBFC) to regulate cinema screening."}, {"q": "Which primary cybercrime legislation passed in 2016 contains Section 37 authorizing government blocking of online content?", "o": ["Telecommunications Act 1996", "PPO Ordinance", "Prevention of Electronic Crimes Act (PECA 2016)", "Digital Rights Act"], "a": 2, "e": "PECA 2016 grants the Pakistan Telecommunication Authority (PTA) broad powers under Section 37 to block online content deemed anti-state or blasphemous."}, {"q": "What was the title of Amnesty International's September 2025 investigative report on state censorship and digital surveillance in Pakistan?", "o": ["Silent Press in South Asia", "Shadows of Control: Censorship and mass surveillance in Pakistan", "The Firewall State", "Digital Walls of Asia"], "a": 1, "e": "Amnesty International published \"Shadows of Control: Censorship and mass surveillance in Pakistan\" in September 2025 detailing digital monitoring."}, {"q": "According to the 2025 Amnesty International report, what is the monitoring capacity of Pakistan's Lawful Intercept Management System (LIMS)?", "o": ["50 million users", "100,000 users", "Up to 4 million people simultaneously", "1 million users"], "a": 2, "e": "LIMS technology enables military and intelligence agencies to monitor telecom data of up to 4 million individuals at once without judicial warrants."}, {"q": "What version of Web Monitoring System (WMS) is deployed by the PTA to perform deep packet inspection and site blocking?", "o": ["WMS 2.0", "WMS 1.0", "CyberWall 2025", "NetShield 3.0"], "a": 0, "e": "WMS 2.0 functions as a commercialized national firewall to throttle bandwidth, block social platforms like X, and restrict VPN access."}, {"q": "What economic pressure tool is used by the state to financially st
